server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Only the API: /metrics, /healthz, /readyz stay off this port (ADR 0012).
    location /api/v1/ {
        access_log off;                      # search terms and notes are personal
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;    # backend's local-only guard compares Origin with Host
    }
}
